name: CodeQL

# Code scanning for the JavaScript in this repository (server, lib, scripts and tests) and for its GitHub Actions workflows. Free for a public repository.
# If CodeQL "default setup" is also turned on in the repository settings, GitHub refuses this advanced setup: keep only one of the
# two (see docs/security-checks.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            language: javascript-typescript
          - name: GitHub Actions workflows
            language: actions
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
