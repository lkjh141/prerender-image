name: Scorecard

# OpenSSF Scorecard scores this repository's security practices (token permissions, pinned dependencies, branch protection, code review)
# and publishes the score for the public repository. It is informational and never gates a merge: it is not part of Verified.
# When the job's GitHub API budget is used up, the job passes with a warning. Any other failure fails the job.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # continue-on-error keeps the failed step from ending the job before the next step decides whether the failure is a usage limit.
      - name: Run Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Scorecard reports errors, not findings: a failed run has no score to show. So the signal is this job's GitHub API budget.
      # An exhausted budget (remaining 0) is a usage limit and passes with a warning; any other failure still fails the job.
      - name: Decide whether a failed run is only a usage limit
        if: steps.scorecard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          if [ "$remaining" = "0" ]; then
            echo "::warning title=Scorecard usage limit reached::Scorecard did not run: this job's GitHub API budget is used up. The next scheduled run covers it."
            echo "### Scorecard: usage limit reached" >> "$GITHUB_STEP_SUMMARY"
            echo "Scorecard did not run because this job's GitHub API budget is used up. The next scheduled run covers it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Scorecard failed for a reason other than its usage limit."
          exit 1

      - name: Upload the results to code scanning
        if: steps.scorecard.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
