# nginx: send crawlers to the prerender service, everyone else to the normal single-page app.
#
# Tested with nginx 1.24 against this image (the behaviours are listed in docs/implementation-guide.md).
# Replace example.com, the TLS lines and the paths. This whole file belongs in the http { } context, for example as a file in
# /etc/nginx/conf.d/. The three `map` blocks must come before the `server` block that uses them.

# Crawlers that do not run JavaScript, or run it badly. Add or remove names to suit you.
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|bingbot|duckduckbot|yandexbot|baiduspider|applebot|facebookexternalhit|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-web|perplexitybot)" 1;
}

# The browser inside the service identifies itself with "Prerender" in its User-Agent. It must never be sent back to the
# service, or every render would trigger another one.
map $http_user_agent $is_prerender_browser {
    default 0;
    "~*prerender" 1;
}

# Only page requests from crawlers go to the service. A path that ends in a file extension (.js, .css, .png ...) is served as the file it is.
map "$is_crawler:$is_prerender_browser:$uri" $send_to_prerender {
    default 0;
    "~*^1:0:.*\.[a-z0-9]{1,6}$" 0;
    "~^1:0:" 1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    # ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    # ssl_certificate_key /etc/ssl/example.com/privkey.pem;

    root /var/www/app;   # the built single-page app, with index.html at its top

    location / {
        # rewrite runs before try_files, so a crawler never gets the empty app shell for a page route.
        if ($send_to_prerender) { rewrite ^ /__prerender last; }
        try_files $uri /index.html;
    }

    location = /__prerender {
        internal;
        # The page to render is part of the path. Write your public address here, not $host: the host name must not come from the request.
        proxy_pass http://127.0.0.1:3000/https://example.com$request_uri;
        proxy_read_timeout 30s;

        # If the service is down or fails, crawlers get the normal app shell instead of an error page.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @without_prerender;
    }

    location @without_prerender {
        try_files /index.html =404;
    }
}
